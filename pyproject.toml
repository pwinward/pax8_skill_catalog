[project]
name = "skills-catalog"
version = "0.1.0"
description = "A shared catalog that AI assistants publish skills to and retrieve them from"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
skills-catalog = "skills_catalog.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
